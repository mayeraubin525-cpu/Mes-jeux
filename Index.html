<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors connexion – Dino</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--top:#ffcf9c;--bot:#fff0d6;--ink:#2b2238;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--top:#0d1030;--bot:#433377;--ink:#f4efff;color-scheme:dark}}
:root[data-theme="dark"]{--top:#0d1030;--bot:#433377;--ink:#f4efff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:linear-gradient(var(--top),var(--bot)) fixed;color:var(--ink);font-family:"Press Start 2P",ui-monospace,monospace}
main{width:min(940px,100%)}
h1{font-size:clamp(14px,2.6vw,20px);font-weight:400;line-height:1.5;margin:0 0 10px}
p{font-size:clamp(8px,1.5vw,10px);line-height:1.9;margin:0 0 22px;opacity:.8}
.card{border-radius:16px;overflow:hidden;box-shadow:0 18px 50px -18px rgba(20,10,40,.55);outline:3px solid color-mix(in srgb,var(--ink) 85%,transparent)}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/1;touch-action:none;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:20px;font-size:clamp(7px,1.4vw,9px);line-height:1.8}
kbd{font:inherit;padding:5px 8px;border:2px solid var(--ink);border-radius:6px;margin-right:6px}
button{font:inherit;color:inherit;background:none;border:2px solid var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;margin-left:auto}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Vous êtes hors connexion</h1>
  <p>Aucun réseau pour l’instant. Profitez-en pour courir dans le désert.</p>
  <div class="card"><canvas id="c" tabindex="0" aria-label="Jeu du dinosaure : Espace pour sauter, flèche bas pour se baisser"></canvas></div>
  <div class="bar">
    <span><kbd>Espace</kbd>sauter</span>
    <span><kbd>↓</kbd>se baisser</span>
    <span>Toucher l’écran pour sauter</span>
    <button id="snd" type="button">Son activé</button>
  </div>
</main>
<script>
(()=>{
const W=900,H=300,GY=250;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join()+')'};
const R=(x,y,w,h)=>ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));

let st='ready',score=0,dist=0,hi=0,speed=380,flash=0,shake=0,deadAt=0,tm=0,clock=0,want=false,held=false,down=false;
try{hi=+localStorage.getItem('dino-hi')||0}catch(e){}
const dino={x:56,b:GY,vy:0,duck:false,fr:0,ft:0};
let obs=[],spawnIn=500;
const stars=Array.from({length:45},()=>({x:rnd(0,W),y:rnd(8,150)}));
const clouds=Array.from({length:4},(_,i)=>({x:i*240+rnd(0,120),y:rnd(30,110),w:rnd(50,80)}));
const pebbles=Array.from({length:28},()=>({x:rnd(0,W),y:GY+rnd(10,42),w:rnd(2,6)}));

/* son */
let AC,muted=false;
function beep(f,d,type,v,to){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d);
  }catch(e){}
}
const snd=document.getElementById('snd');
snd.onclick=()=>{muted=!muted;snd.textContent=muted?'Son coupé':'Son activé';cv.focus()};

/* entrées */
function press(){
  if(st==='ready'){st='run';want=true;}
  else if(st==='run')want=true;
  else if(st==='dead'&&performance.now()-deadAt>450)reset();
  held=true;
}
function reset(){st='run';score=0;dist=0;speed=380;obs=[];spawnIn=500;dino.b=GY;dino.vy=0;flash=0;want=false;}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press();}
  else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();down=true;}
});
addEventListener('keyup',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code))held=false;
  if(['ArrowDown','KeyS'].includes(e.code))down=false;
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
cv.addEventListener('pointerup',()=>{held=false});
cv.addEventListener('pointercancel',()=>{held=false});

/* obstacles */
function spawn(){
  if(score>150&&Math.random()<.28){
    const y=[GY-28,GY-58,GY-90][Math.random()*3|0];
    obs.push({k:'p',x:W+20,y,w:46,h:30,fl:0,ft:0});
  }else{
    const big=Math.random()<.4,uw=big?26:18,h=big?52:36,n=1+(Math.random()*(big?2:3)|0);
    obs.push({k:'c',x:W+20,y:GY-h,w:n*uw+(n-1)*6,h,uw,n});
  }
  spawnIn=rnd(380,640)+speed*.45;
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(dt){
  clock+=dt;
  if(shake>0)shake-=dt;
  if(flash>0)flash-=dt;
  const bg=st==='run'?speed:st==='ready'?40:0;
  clouds.forEach(c=>{c.x-=bg*.15*dt;if(c.x<-100){c.x=W+rnd(0,200);c.y=rnd(30,110)}});
  pebbles.forEach(p=>{p.x-=bg*dt;if(p.x<-8){p.x=W+rnd(0,40);p.y=GY+rnd(10,42)}});
  tm+=bg*dt;
  if(st!=='run')return;

  speed=Math.min(380+score*.9,820);
  dist+=speed*dt;
  const ns=Math.floor(dist*.025);
  if(ns!==score){
    if(Math.floor(ns/100)>Math.floor(score/100)){flash=.9;beep(880,.12,'square',.05,1320);}
    score=ns;
  }
  const g=dino.b>=GY;
  if(want&&g){dino.vy=-800;beep(520,.14,'square',.04,900);}
  want=false;
  dino.duck=down&&g;
  let grav=2500;
  if(!g){ if(down)grav=7000; else if(dino.vy<0&&!held)grav=5200; }
  dino.vy+=grav*dt;dino.b+=dino.vy*dt;
  if(dino.b>=GY){dino.b=GY;dino.vy=0;}
  dino.ft+=dt;if(dino.ft>.1){dino.ft=0;dino.fr^=1;}

  spawnIn-=speed*dt;if(spawnIn<=0)spawn();
  obs.forEach(o=>{o.x-=speed*dt;if(o.k==='p'){o.ft+=dt;if(o.ft>.16){o.ft=0;o.fl^=1;}}});
  obs=obs.filter(o=>o.x>-120);

  const dh=dino.duck?30:47,dw=dino.duck?59:44;
  const db={x:dino.x+6,y:dino.b-dh+4,w:dw-14,h:dh-8};
  for(const o of obs){
    const ob=o.k==='c'?{x:o.x+3,y:o.y+3,w:o.w-6,h:o.h-3}:{x:o.x+4,y:o.y+6,w:o.w-8,h:o.h-12};
    if(hit(db,ob)){
      st='dead';deadAt=performance.now();shake=.3;
      beep(170,.4,'sawtooth',.06,45);
      if(score>hi){hi=score;try{localStorage.setItem('dino-hi',hi)}catch(e){}}
      break;
    }
  }
}

/* dessin */
let C={};
function drawDino(){
  const x=dino.x,b=dino.b,g=b>=GY,dead=st==='dead';
  ctx.fillStyle=C.ink;
  if(dino.duck){
    const y=b-30;
    R(x+2,y+6,42,18);R(x-6,y+8,10,8);R(x+34,y,25,16);
    ctx.fillStyle=C.sky;R(x+46,y+11,13,2);R(x+46,y+3,5,5);
    ctx.fillStyle=C.ink;R(x+48,y+4,2,3);
    R(x+10,y+24,6,dino.fr?3:6);R(x+28,y+24,6,dino.fr?6:3);
    return;
  }
  const y=b-47;
  R(x,y+16,10,10);R(x+4,y+24,6,6);
  R(x+6,y+16,26,22);R(x+28,y+14,8,16);
  R(x+22,y,22,16);R(x+24,y+12,12,8);
  R(x+32,y+26,8,3);R(x+38,y+26,3,5);
  const l1=g?(dino.fr?9:4):9,l2=g?(dino.fr?4:9):9;
  R(x+10,y+38,6,l1);R(x+22,y+38,6,l2);
  ctx.fillStyle=C.sky;R(x+34,y+12,10,2);R(x+36,y+3,6,6);
  ctx.fillStyle=C.ink;
  if(dead){R(x+36,y+3,2,2);R(x+40,y+3,2,2);R(x+38,y+5,2,2);R(x+36,y+7,2,2);R(x+40,y+7,2,2);}
  else R(x+39,y+4,2,3);
}
function drawCactus(o){
  ctx.fillStyle=C.cac;
  for(let i=0;i<o.n;i++){
    const x=o.x+i*(o.uw+6),y=o.y,w=o.uw,h=o.h,tw=w>20?10:8,tx=x+((w-tw)>>1);
    R(tx,y,tw,h);R(tx+2,y-2,tw-4,2);
    R(x,y+h*.38,tx-x+2,5);R(x,y+h*.22,5,h*.16+5);
    R(tx+tw-2,y+h*.5,x+w-tx-tw+2,5);R(x+w-5,y+h*.34,5,h*.16+5);
    ctx.fillStyle='rgba(255,255,255,.22)';R(tx+2,y+2,2,h-4);ctx.fillStyle=C.cac;
  }
}
function drawPtera(o){
  const x=o.x,y=o.y;ctx.fillStyle=C.ink;
  R(x+10,y+12,26,8);R(x+34,y+8,12,8);R(x+44,y+11,6,3);R(x,y+14,10,3);
  if(o.fl){R(x+16,y+1,10,11);R(x+20,y-3,6,4);}
  else{R(x+16,y+20,12,6);R(x+18,y+26,8,4);}
  ctx.fillStyle=C.sky;R(x+38,y+10,3,3);
}
function draw(){
  const ph=((dist*.025)%1000)/1000,n=.5-.5*Math.cos(2*Math.PI*ph);
  C={
    top:mix('#ffcf9c','#0d1030',n),bot:mix('#fff0d6','#433377',n),
    far:mix('#f0c08f','#2b2655',n),near:mix('#dca06a','#1f1a45',n),
    sand:mix('#e8b985','#171433',n),ink:mix('#2b2238','#f4efff',n),
    cac:mix('#3d6b4b','#8ee0a4',n),sky:mix('#fff0d6','#433377',n)
  };
  const root=document.documentElement.style;
  root.setProperty('--top',C.top);root.setProperty('--bot',C.bot);root.setProperty('--ink',C.ink);

  ctx.save();
  if(shake>0)ctx.translate(rnd(-3,3),rnd(-3,3));
  const gr=ctx.createLinearGradient(0,0,0,GY);gr.addColorStop(0,C.top);gr.addColorStop(1,C.bot);
  ctx.fillStyle=gr;ctx.fillRect(-6,-6,W+12,GY+6);

  /* étoiles */
  const sa=Math.max(0,(n-.45)*1.8);
  if(sa>0){ctx.fillStyle='#fff';stars.forEach((s,i)=>{ctx.globalAlpha=sa*(.55+.45*Math.sin(clock*2.5+i*7));R(s.x,s.y,i%5===0?3:2,i%5===0?3:2);});ctx.globalAlpha=1;}

  /* soleil / lune */
  const q=(ph+.25)%1,ox=W*(.08+.84*q),oy=130-85*Math.sin(Math.PI*q);
  ctx.globalAlpha=Math.sin(Math.PI*q);
  ctx.fillStyle=mix('#ffb347','#fdf3d0',n);
  ctx.beginPath();ctx.arc(ox,oy,22,0,7);ctx.fill();
  if(n>.5){ctx.fillStyle=mix('#fdf3d0','#d9d0f0',Math.min(1,(n-.5)*2));R(ox-9,oy-8,6,6);R(ox+4,oy+3,7,7);}
  ctx.globalAlpha=1;

  /* dunes */
  const dune=(off,base,amp,col,k)=>{
    ctx.fillStyle=col;
    for(let x=-4;x<W+4;x+=4){
      const t=x+off,h=base+amp*Math.sin(t*.011*k)+amp*.5*Math.sin(t*.027*k+1.3);
      R(x,GY-h,4,h);
    }
  };
  dune(tm*.12,70,22,C.far,1);
  /* nuages */
  ctx.globalAlpha=lerp(.8,.3,n);ctx.fillStyle=mix('#ffffff','#8a86c9',n);
  clouds.forEach(c=>{R(c.x,c.y+8,c.w,8);R(c.x+8,c.y,c.w-24,8);R(c.x+c.w-20,c.y+4,12,6);});
  ctx.globalAlpha=1;
  dune(tm*.3+400,34,12,C.near,1.6);

  /* sol */
  ctx.fillStyle=C.sand;R(-6,GY,W+12,H-GY+6);
  ctx.fillStyle=C.ink;R(-6,GY,W+12,3);
  ctx.globalAlpha=.35;pebbles.forEach(p=>R(p.x,p.y,p.w,2));ctx.globalAlpha=1;

  obs.forEach(o=>o.k==='c'?drawCactus(o):drawPtera(o));
  drawDino();
  ctx.restore();

  /* interface */
  ctx.font="14px 'Press Start 2P',monospace";ctx.textBaseline='top';ctx.textAlign='right';
  const pad=n=>String(n).padStart(5,'0');
  const blink=flash>0&&Math.floor(flash*8)%2===0;
  ctx.fillStyle=C.ink;ctx.globalAlpha=.55;
  ctx.fillText('HI '+pad(hi),W-170,18);ctx.globalAlpha=1;
  if(!blink)ctx.fillText(pad(score),W-20,18);
  ctx.textAlign='center';
  if(st==='ready'){
    ctx.fillText('Espace pour courir',W/2,100);
  }else if(st==='dead'){
    ctx.font="24px 'Press Start 2P',monospace";ctx.fillText('Perdu !',W/2,92);
    ctx.font="11px 'Press Start 2P',monospace";ctx.fillText('Espace pour rejouer',W/2,132);
  }
}
let last=0;
function loop(t){
  const dt=Math.min((t-last)/1000||0,.05);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
